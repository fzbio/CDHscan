[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cdhscan"
version = "1.0.0"
description = "Contact difference hotspots from reference-aligned Hi-C and short-read WGS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
# Installed through environment.yml (conda); listed here for pip users.
dependencies = ["numpy", "pandas", "scikit-learn", "torch", "pysam", "hic-straw"]

[project.scripts]
cdhscan = "cdhscan.cli:main"

[tool.setuptools.packages.find]
include = ["cdhscan*"]
